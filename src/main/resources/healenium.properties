########################################################
# Healenium Client Configuration
########################################################

# Number of fallback attempts Healenium will try when an element?s original locator fails.
# Integer ? 0: 0 disables healing, 1 tries one alternative, etc.
recovery-tries=1

# Similarity threshold for accepting a candidate locator.
# Float between 0.0 and 1.0: only locators scoring ? this value will be used.
# final_score = (0.4 * attribute_match_score) +
#              (0.3 * tag_match_score) +
#              (0.2 * text_similarity_score) +
#              (0.1 * xpath_distance_score)
score-cap=0.9

# Master switch for element healing.
# true  = enable healing (Healenium intercepts and repairs locators)
# false = disable healing (Selenium runs without intervention)
heal-enabled=true

# Hostname or IP where the Healenium Server REST API is running.
# e.g., localhost for local Docker setups, or remote server address.
serverHost=localhost

# Port on which the Healenium Server listens for client connections.
# Must match the exposed port on your Docker/Kubernetes service.
serverPort=7878

# Port used by the Healenium Imitator proxy component.
# The WebDriver client should point here; the proxy forwards commands to serverPort.
imitatePort=8000
